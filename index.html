<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operation Browser Warfare</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#12151c;
    --panel:#1a1f2a;
    --panel2:#222836;
    --line:#343b4d;
    --ink:#e8e4d8;
    --muted:#9aa3b5;
    --gold:#c9a35a;
    --gold2:#e8c878;
    --red:#d06a62;
    --green:#7db992;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(ellipse at 10% -10%,#2a2430 0,transparent 42%),
      radial-gradient(ellipse at 100% 0%,#1c2833 0,transparent 36%),
      var(--bg);
    color:var(--ink);
    font:15px/1.45 "Segoe UI",system-ui,sans-serif;
    overflow:hidden;
  }
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  #app{height:100%;display:grid;grid-template-rows:auto auto auto auto auto minmax(0,1fr) auto}
  .mast,.resbar,.tabs,.subs,.dock{padding-left:18px;padding-right:18px}
  .mast{
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
    padding-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line);
    background:linear-gradient(#1b202bcc,#12151c);
  }
  .eyebrow{font:800 10px/1.2 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  h1{margin:4px 0 0;font-size:clamp(1.4rem,3vw,2.1rem);letter-spacing:-.04em;line-height:1}
  .sub{margin:4px 0 0;color:var(--muted);font-size:13px}
  .mast-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .pill{
    border:1px solid var(--line);background:var(--panel2);padding:7px 11px;
    font:800 11px/1 Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gold2)
  }
  .resbar{
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;
    padding-top:8px;padding-bottom:8px;background:#10131a;border-bottom:1px solid var(--line)
  }
  .res{background:var(--panel);border:1px solid var(--line);padding:8px 10px;min-width:0}
  .res span{display:block;color:var(--muted);font:800 10px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  .res b{display:block;margin-top:3px;font-size:1.05rem;letter-spacing:-.03em}
  .tabs{
    display:flex;gap:6px;padding-top:8px;padding-bottom:8px;
    background:#0e1117;border-bottom:0;overflow-x:auto
  }
  .subs{
    display:flex;gap:6px;align-items:center;padding-top:0;padding-bottom:8px;
    background:#0e1117;border-bottom:1px solid var(--line);overflow-x:auto
  }
  .subs.nested{background:#141821;padding-top:6px}
  .subs-label{
    font:800 10px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);padding-right:8px;border-right:1px solid var(--line);margin-right:4px;white-space:nowrap
  }
  .tab,.subtab,.btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    padding:8px 12px;min-height:40px;font-weight:750
  }
  .tab,.subtab{flex:0 0 auto;letter-spacing:.02em}
  .subtab{
    min-height:34px;padding:6px 11px;border-radius:999px;background:#161b25;font-size:13px
  }
  .tab[aria-selected="true"],.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1408}
  .subtab[aria-selected="true"]{background:#2b261b;border-color:var(--gold);color:var(--gold2)}
  .btn.danger{border-color:#7a3d3a;color:#f0b0ab}
  .btn.ghost{background:transparent}
  .btn.small{min-height:34px;padding:5px 9px;font-size:13px}
  .stage{min-height:0;overflow:auto;padding:14px 18px 18px}
  .view{display:none;height:100%}
  .view.active{display:block}
  .split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,0.75fr);gap:14px;min-height:100%}
  .split.even{grid-template-columns:1fr 1fr}
  .panel{
    background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0
  }
  .panel h2{margin:0 0 8px;font-size:1.15rem}
  .panel h3{margin:0 0 8px;font-size:1rem}
  .muted{color:var(--muted)}
  .tiny{font-size:12px}
  .good{color:var(--green)}
  .bad{color:var(--red)}
  .gold{color:var(--gold2)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .wrap{flex-wrap:wrap}
  .stack{display:grid;gap:10px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .card{background:var(--panel2);border:1px solid var(--line);padding:12px;min-width:0}
  .card.selected,.node.selected{outline:2px solid var(--gold)}
  .bar{height:7px;background:#10131a;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--gold)}
  .chip{display:inline-flex;align-items:center;border:1px solid var(--line);padding:3px 8px;font-size:11px;color:var(--muted);margin:2px 4px 2px 0}
  .chip.on{color:var(--gold2);border-color:#6d5a32}
  .note{border-left:3px solid var(--gold);background:var(--panel2);padding:10px 12px;font-size:13px;color:var(--muted)}
  .empty{border:1px dashed var(--line);padding:22px;color:var(--muted);text-align:center}
  .dock{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding-top:8px;padding-bottom:10px;border-top:1px solid var(--line);
    background:#0e1117
  }
  .mapwrap{position:relative;height:min(68vh,720px);overflow:auto;background:#1a2a32;border:1px solid #6a5a3c;box-shadow:inset 0 0 0 4px #cbb58a,inset 0 0 0 6px #6a5a3c}
  svg.map{width:1680px;height:1180px;min-width:1680px;min-height:1180px;display:block}
  .map-screen{margin:0}
  .mapframe{
    background:#1a2a32;
    border:1px solid #6a5a3c;
    box-shadow:inset 0 0 0 5px #cbb58a,inset 0 0 0 7px #6a5a3c;
    max-width:100%;
    margin:0 auto
  }
  .mapframe .map-plaque{
    display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;
    margin:7px 7px 0;padding:10px 14px;
    background:linear-gradient(#2c261cee,#1b1812f2);
    border:1px solid #6a5a3c;border-bottom:0;
    color:var(--ink)
  }
  .mapframe .map-plaque h2{margin:0;font-size:1.2rem}
  .mapframe .map-levy{display:flex;flex-wrap:wrap;gap:6px 12px;max-width:42vw}
  .mapframe .mapwrap{
    height:min(68vh,720px);
    max-height:none;
    width:auto;
    overflow:auto;
    border:0;box-shadow:none;margin:0 7px 7px
  }
  @media (max-width: 1100px){
    .mapframe .map-levy{max-width:100%}
    .mapframe .mapwrap{height:min(60vh,560px)}
  }
  .node{cursor:pointer}
  .node text{pointer-events:none}
  .unit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:start}
  .unit-row .levy-cost{grid-column:1/-1}
  .step{display:flex;gap:6px;align-items:center}
  .step button{min-width:72px;height:34px;padding:0 8px;width:auto}
  .levy-cost{display:grid;gap:4px;font-size:12px;color:var(--muted)}
  .levy-cost b{color:var(--ink);font-weight:750}
  .cost-chip{display:inline-block;border:1px solid var(--line);background:#161b25;padding:2px 7px;margin:2px 4px 0 0;color:var(--gold2)}
  #field{
    position:fixed;inset:0;z-index:36;display:flex;flex-direction:column;
    background:#12151cf2
  }
  #field.hidden{display:none}
  #field .field-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  #field canvas{width:100%;height:min(52vh,420px);background:#2a3224;display:block}
  #field .field-bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
  #field .field-bar .btn{min-height:36px}
  #event{
    position:fixed;inset:0;z-index:32;display:flex;align-items:center;justify-content:center;
    background:#0b0e14cc;padding:18px
  }
  #event.hidden{display:none}
  #event .sheet{
    width:min(520px,94vw);max-height:min(80vh,640px);overflow:auto;
    background:#1c2230;border:1px solid var(--gold);padding:18px 18px 14px;
    box-shadow:0 18px 50px #000a
  }
  #event .sheet h3{margin:0 0 8px;font-size:1.2rem}
  #event .sheet p{margin:0 0 12px;color:var(--muted);font-size:14px}
  #event .choices{display:flex;flex-direction:column;gap:8px}
  #event .choices .btn{text-align:left;width:100%}
  #tutor{
    position:fixed;right:16px;top:16px;z-index:30;width:min(92vw,360px);
    background:#1c2230;border:1px solid var(--gold);padding:14px 14px 12px;
    box-shadow:0 12px 40px #0008
  }
  #tutor h3{margin:0 0 6px;font-size:1.05rem}
  #tutor p{margin:0 0 10px;color:var(--muted);font-size:13px}
  #tutor .tutor-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #tutor label.never{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);margin:8px 0}
  #tutor label.never input{margin-top:2px}
  .log{max-height:220px;overflow:auto}
  .log article{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  #gate{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:#0a0b10 url('hall-gate.jpg') center/cover no-repeat;
    color:var(--ink);padding:24px;overflow:auto
  }
  #gate.hidden{display:none!important}
  #gate .veil{
    position:absolute;inset:0;
    background:linear-gradient(180deg,#0b0e14cc 0%,#0b0e14a8 40%,#0b0e14e6 100%);
    pointer-events:none
  }
  #gate .sheet{
    position:relative;z-index:1;width:min(520px,94vw);
    background:#1c2230f2;border:1px solid var(--gold);padding:22px 22px 18px;
    box-shadow:0 18px 50px #000a
  }
  #gate .sheet h1{margin:8px 0 6px;font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.04em}
  #gate .actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  #gate .actions .btn{width:100%;text-align:left}
  #setup{
    position:fixed;inset:0;z-index:8;display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    background:#12151c;color:var(--ink);overflow:auto
  }
  #setup header,#setup footer{padding:12px 18px}
  #setup .mapwrap{height:min(70vh,740px);overflow:auto;margin:0 18px}
  #setup .pickbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
  #setup label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
  #setup input{background:var(--panel2);border:1px solid var(--line);padding:8px 10px;min-width:220px}
  .settle-skin{
    background-color:#1c1810;
    background-repeat:no-repeat;
    background-position:center;
    background-size:cover;
    min-height:calc(100vh - 250px);
    padding:8px;
    position:relative
  }
  .settle-skin::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,#12151c55 0%,#12151c2a 42%,#12151c66 100%);
    pointer-events:none
  }
  .settle-skin > *{position:relative;z-index:1}
  .settle-skin .panel{background:#1a1f2ab8;backdrop-filter:blur(2px)}
  .card.work-card{
    position:relative;overflow:hidden;
    background-color:#4a4030;
    background-size:cover;
    background-position:center;
    min-height:136px
  }
  .work-card::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,#12151c33 0%,#12151c1f 42%,#12151c59 100%);
    pointer-events:none
  }
  .work-card > *{position:relative;z-index:1;text-shadow:0 1px 3px #000d}
  .doctrine-tip{position:relative;cursor:help;border-bottom:1px dotted var(--gold);color:var(--gold2)}
  .doctrine-tip .tip{
    display:none;position:absolute;left:0;bottom:calc(100% + 8px);z-index:8;
    width:min(260px,70vw);padding:10px 12px;
    background:#1c2230;border:1px solid var(--gold);color:var(--ink);
    box-shadow:0 10px 28px #0008;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none
  }
  .doctrine-tip .tip b{display:block;margin-bottom:4px;color:var(--gold2)}
  .doctrine-tip:hover .tip,.doctrine-tip:focus .tip{display:block}
  .house-card{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:stretch;min-height:148px;padding:12px}
  .house-card .banner{
    width:88px;height:100%;min-height:124px;object-fit:cover;object-position:center;
    border:1px solid #2b2116;background:#1a140c
  }
  .stance{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:2px 7px}
  .stance.war{color:var(--red);border-color:#6a3030}
  .stance.ally{color:var(--green);border-color:#2f5a40}
  .stance.peace{color:var(--muted)}
  .toast{
    position:fixed;left:50%;bottom:64px;transform:translateX(-50%);
    background:#2a2430;border:1px solid var(--gold);padding:10px 14px;max-width:min(90vw,520px);z-index:20
  }
  .hidden{display:none!important}
  @media(max-width:900px){
    .split,.split.even,.grid2,.grid3,.resbar{grid-template-columns:1fr 1fr}
    h1{font-size:1.35rem}
  }
  @media(max-width:640px){
    body{overflow:auto}
    #app{height:auto;min-height:100%}
    .resbar,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
    .split,.split.even{grid-template-columns:1fr}
    .mast{align-items:flex-start;flex-direction:column}
    .tabs,.subs{position:sticky;top:0;z-index:5}
    .subs{top:48px}
    .dock{flex-direction:column;align-items:stretch}
    .dock .btn{width:100%}
  }
</style>
</head>
<body>
<div id="app">
  <header class="mast">
    <div>
      <div class="eyebrow">Operation Browser Warfare</div>
      <h1 id="realm-name">The Ashen Hold</h1>
      <p class="sub">Raise the levy. March the host. Make the other houses change how they fight.</p>
    </div>
    <div class="mast-tools">
      <div class="pill" id="when">Year 1 · Spring</div>
      <button class="btn small" data-act="rename">Rename realm</button>
      <button class="btn small" data-act="tutor">Guide</button>
      <button class="btn small" data-act="new">New campaign</button>
    </div>
  </header>
  <section class="resbar" id="resbar"></section>
  <nav class="tabs" id="tabs" aria-label="What you are viewing"></nav>
  <nav class="subs" id="subs" aria-label="Screens in this view"></nav>
  <nav class="subs nested hidden" id="settle-subs" aria-label="Screens in this settlement"></nav>
  <main class="stage">
    <section class="view active" id="stage"></section>
  </main>
  <footer class="dock">
    <div class="tiny muted" id="dock-copy">One screen at a time. End the season when the host is ready.</div>
    <div class="row wrap">
      <button class="btn" data-act="save">Save</button>
      <button class="btn primary" data-act="end">End season</button>
    </div>
  </footer>
</div>
<div id="gate" class="hidden"></div>
<div id="setup" class="hidden"></div>
<div id="tutor" class="hidden"></div>
<div id="event" class="hidden"></div>
<div id="field" class="hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
(() => {
  const KEY = 'obw-v3';
  const TUTOR_KEY = 'obw-tutor-skip';
  const MAP_SRC = 'map.jpg';
  const MAP_W = 1176;

    {id:'fen',   file:'map-fen.jpg',   name:'The Drowned Midland',line:'Reeds and lakes around a raised field. The roads go wet.'}
  ];
  function isleBy(id){ return ISLES.find(i=>i.id===id) || ISLES[0]; }
  function mapSrc(){
    return (S && S.world && S.world.map) || (setupWorld && setupWorld.map) || MAP_SRC;
  }
  function currentIsle(){
    const id = (S && S.world && S.world.isle) || (setupWorld && setupWorld.isle);
    return isleBy(id);
  }
  const SETTLE_ART = {

  };

  const CLIENT_KEY = 'obw-google-client';

  const FILE_KEY = 'obw-drive-file';

  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile openid';
  const memoryStore = {};
  let persistOk = false;
  try{

  }catch{ persistOk = false; }
  function storeGet(k){
    if(persistOk){
      try{ return window.localStorage.getItem(k); }catch{}

    return Object.prototype.hasOwnProperty.call(memoryStore,k) ? memoryStore[k] : null;
  }
  function storeSet(k,v){

  }
  function storeDel(k){
    delete memoryStore[k];
    if(!persistOk) return;
    try{ window.localStorage.removeItem(k); }catch{}
  }
  const SEASONS = ['Spring','Summer','Harvest','Winter'];
  const FACTIONS = {

    dune:   {id:'dune',   name:'Dune Watch',         color:'dune',   doctrine:'shot'},

    reed:   {id:'reed',   name:'Reedmen',            color:'reed',   doctrine:'pike'}
  };

  function hashSeed(s){
    let h = 2166136261;
    const str = String(s);
    for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h>>>0;
  }
  function rng32(seed){
    let a = seed>>>0;
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a>>>15, 1 | a);
      t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
      return ((t ^ t>>>14)>>>0) / 4294967296;
    };
  }
  function generateWorld(seed, isleId){
    const rng = rng32(seed||hashSeed(Date.now()));
    const isle = isleId ? isleBy(isleId) : ISLES[Math.floor(rng()*ISLES.length)];
    const sites = PROVINCES.map(p=>({id:p.id, name:p.name, x:p.x, y:p.y, terrain:p.terrain}));
    const placed = [];
    const minD = 148;
    for(const s of sites){
      let ok=false;
      for(let k=0;k<120 && !ok;k++){
        const x = 70 + rng()*1260;
        const y = 50 + rng()*900;
        if(placed.every(q=>Math.hypot(q.x-x,q.y-y)>=minD)){
          s.x=Math.round(x); s.y=Math.round(y); placed.push(s); ok=true;
        }
      }
      if(!ok){ s.x=90+(placed.length%8)*160; s.y=70+Math.floor(placed.length/8)*200; placed.push(s); }
    }
    for(const s of sites){
      const roll = rng();
      if(isle.id==='dune'){
        if(s.y<240) s.terrain = roll>0.4?'hill':'open';
        else if(s.x>880) s.terrain = 'open';
        else s.terrain = roll>0.62?'river':'open';
      } else if(isle.id==='fjord'){
        if(s.x>720) s.terrain = roll>0.38?'hill':'wood';
        else if(s.y>560) s.terrain = roll>0.5?'river':'wood';
        else s.terrain = roll>0.5?'wood':'open';
      } else if(isle.id==='fen'){
        if(s.y>500) s.terrain = roll>0.35?'river':'wood';
        else if(s.x<320) s.terrain = 'wood';
        else s.terrain = roll>0.55?'open':'wood';
      } else {
        if(s.y>560) s.terrain = roll>0.45?'river':'open';
        else if(s.y<200) s.terrain = roll>0.4?'hill':'wood';
        else if(s.x<280) s.terrain = roll>0.5?'wood':'open';
        else s.terrain = roll>0.55?'open':roll>0.28?'wood':'hill';
      }
    }
    const ids = sites.map(s=>s.id);
    const pt = id=>sites.find(s=>s.id===id);
    const dist=(a,b)=>Math.hypot(pt(a).x-pt(b).x, pt(a).y-pt(b).y);
    const used=new Set([ids[0]]);
    const edges=[];
    while(used.size<ids.length){
      let best=null, bestD=1e9;
      for(const a of used) for(const b of ids){
        if(used.has(b)) continue;
        const d=dist(a,b);
        if(d<bestD){ bestD=d; best=[a,b]; }
      }
      edges.push(best); used.add(best[1]);
    }
    const extra=[];
    for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
      const a=ids[i], b=ids[j];
      if(edges.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a))) continue;
      const d=dist(a,b);
      if(d<240) extra.push([a,b,d]);
    }
    extra.sort((x,y)=>x[2]-y[2]);
    extra.slice(0,9).forEach(e=>edges.push([e[0],e[1]]));
    return {seed, isle:isle.id, map:isle.file, sites:sites.map(s=>({id:s.id,x:s.x,y:s.y,terrain:s.terrain})), edges};
  }

  function runCaptains(){

  function collectVassals(){

      const lands = owned(fid);
      if(!lands.length){
        delete S.vassals[fid];

      let gold=0, food=0;
      for(const id of lands){

      const v = S.vassals[fid];

  function diploAct(fid, want){
    if(!FACTIONS[fid] || fid==='player') return;
    const cur = stance(fid);
    const house = HOUSE[fid];
    const name = FACTIONS[fid].name;
    const j = theyJudge(fid);
    if(!owned(fid).length && want!=='war') return toast('That house is broken. No one left to treat with.');
    if(want==='gift'){
      const price = 25;
      if(S.gold < price) return toast('Not enough gold for a gift.');
      S.gold -= price;
      const gain = Math.round(8 * (house.gift||1));
      addFeel(fid, gain, name+': '+voiceOf(fid,'gift'));
      pushLog('Gift of '+price+' gold to '+name+'.');
      toast(name+' weighs the gift.');
    } else if(want==='war'){
      if(cur==='war') return toast('Already at war.');
      if(cur==='ally'){
        addFeel(fid, -24 - house.honor, name+': '+voiceOf(fid,'break'));

      }

      S.authority = Math.max(0, S.authority-1);
      pushLog('War on '+name+'.');
      toast('War declared.');
    } else if(want==='peace'){
      if(cur==='peace') return toast('Already at peace.');
      if(cur==='ally'){
        setStance(fid,'peace');
        addFeel(fid, -6, name+': '+voiceOf(fid,'break'));
        pushLog('The pact with '+name+' is set aside.');
        toast('Pact ended. Peace remains.');
      } else {
        const demand = house.greedy>=6 ? 20 : house.warlike>=7 ? 15 : 0;
        const weak = j.ratio >= 1.25;
        const tired = j.score >= -20 || house.warlike<=3 || weak;
        if(!tired && j.score < -25){
          addFeel(fid, -4, name+': '+voiceOf(fid,'peaceNo'));
          toast(name+' refuses peace.');
          save(); render(); return;
        }
        if(demand && S.gold < demand && !weak){
          addFeel(fid, -2, name+' wants '+demand+' gold on the table before any truce.');
          toast(name+' wants '+demand+' gold for a truce.');
          save(); render(); return;
        }
        if(demand && S.gold >= demand && !weak){ S.gold -= demand; }
        setStance(fid,'peace');
        addFeel(fid, 8, name+': '+voiceOf(fid,'peaceYes'));
        pushLog('Peace with '+name+'.');
        toast('Peace stands.');
      }
    } else if(want==='ally'){
      if(cur==='war') return toast('They will not bind while the war is open. Seek peace first.');
      if(cur==='ally') return toast('Already bound.');
      const need = 22 + house.pride*2 - Math.round((j.ratio-1)*10);
      const wolfBlock = house.temper==='predatory' && j.ratio < 1.15;
      const wildBlock = house.honor<=3 && j.score < 30;
      if(wolfBlock || wildBlock || j.score < need){
        addFeel(fid, -3, name+': '+voiceOf(fid,'refuse'));
        toast(name+' declines the pact.');
        save(); render(); return;
      }
      setStance(fid,'ally');
      addFeel(fid, 12, name+': '+voiceOf(fid,'accept'));
      S.authority += 1;
      pushLog(name+' takes your hand.');
      toast('Alliance sealed.');

  let FIELD = null;
  let fieldRAF = 0;
  const FIELD_TINT = {
    militia:'#c5c0ae', swordsmen:'#e2c16a', pikemen:'#8fcaa6',
    crossbows:'#8eb4e4', longbows:'#86a85e', lightHorse:'#e0b24a',
    heavyHorse:'#b4a494', horseBow:'#d46c5c'

  function fieldKit(k){
    const u = UNITS[k];
    return {
      hp: 16 + u.def*3 + (u.role==='line'?10:0) + (u.role==='pike'?8:0),
      dmg: 3 + Math.round(u.atk*0.7) + Math.round(u.shock*0.25),
      range: u.shot>0 ? 140 + u.shot*10 : 26,
      speed: (u.role==='raid'||u.role==='kite')?1.35 : u.role==='shock'?1.15 : u.role==='pike'?0.62 : 0.85,
      cd: u.shot>0 ? 640 : 420,

  function cloneArmy(a){

  function startFieldBattle(from, to, marching, defending, defender){
    const box = document.getElementById('field');

      from, to, defender,

  function paintField(){
    const box = document.getElementById('field');
    if(!FIELD || !box) return;
    const atkN = armyCount(FIELD.pool.atk), defN = armyCount(FIELD.pool.def);
    const liveA = FIELD.live.filter(u=>u.side==='atk').length;
    const liveD = FIELD.live.filter(u=>u.side==='def').length;
    box.innerHTML = `
      <div class="field-top">

          <h2 style="margin:0">${terrainOf(FIELD.to)} ground</h2>

      <canvas id="field-cv" width="900" height="320"></canvas>
      <div class="field-bar">
        <span class="tiny muted">Commit men. They walk until one banner breaks.</span>

          const n = FIELD.pool.atk[k]||0;

  function dropField(side, k){
    if(!FIELD || FIELD.done) return;
    if(!(FIELD.pool[side][k]>0)) return;
    const liveN = FIELD.live.filter(u=>u.side===side).length;
    if(liveN>=12) return toast('The line is full. Wait for gaps.');
    FIELD.pool[side][k]--;
    const kit = fieldKit(k);
    const lane = 36 + Math.floor(Math.random()*6)*44;
    FIELD.live.push({
      k, side, x: side==='atk'?36:FIELD.w-36, y:lane,
      hp:kit.hp, max:kit.hp, ready:0,
      ...kit
    });
  }
  function releaseHost(side){
    if(!FIELD) return;
    const keys = Object.keys(UNITS).filter(k=>FIELD.pool[side][k]>0);
    let guard = 40;
    while(keys.length && FIELD.live.filter(u=>u.side===side).length<12 && guard--){
      const k = keys[Math.floor(Math.random()*keys.length)];
      dropField(side, k);
      if(!(FIELD.pool[side][k]>0)) keys.splice(keys.indexOf(k),1);
    }
  }
  function fieldCounts(){
    const a = emptyArmy(), d = emptyArmy();
    for(const k of Object.keys(UNITS)){ a[k]=FIELD.pool.atk[k]; d[k]=FIELD.pool.def[k]; }
    for(const u of FIELD.live){
      if(u.side==='atk') a[u.k]++; else d[u.k]++;
    }
    return {a,d};
  }
  function endField(winner, fled){
    if(!FIELD || FIELD.done) return;
    FIELD.done = true;
    cancelAnimationFrame(fieldRAF);
    const from = FIELD.from, to = FIELD.to, defender = FIELD.defender;
    const {a,d} = fieldCounts();
    const src = S.provinces[from], dst = S.provinces[to];
    lastBattle = {
      year:S.year, season:S.season, from, to,
      attacker:'player', defender,
      winner, nextAtk:a, nextDef:d,
      A:{shot:0,shock:0,line:0,pike:0}, D:{shot:0,shock:0,line:0,pike:0},
      ratio:1, atkLoss:0.3, defLoss:0.3, terrain:terrainOf(to)
    };

      dst.army = a;

    } else {
      dst.army = d;
      src.army = a;
      S.authority = Math.max(0, S.authority-1);
      pushLog(fled?('Broke off from '+nameOf(to)+'.'):('Repulsed at '+nameOf(to)+'.'));
    }
    rememberPlayer({fight:true, vs:defender, won:winner==='atk'});
    checkCrown();
    document.getElementById('field').classList.add('hidden');
    FIELD = null;
    openView('warfare','report');
    save(); render();
  }
  function tickField(now){
    if(!FIELD || FIELD.done) return;
    const dt = Math.min(40, now-FIELD.last); FIELD.last = now;
    FIELD.aiT += dt;
    if(FIELD.aiT>480){
      FIELD.aiT = 0;
      if(armyCount(FIELD.pool.def) && FIELD.live.filter(u=>u.side==='def').length<12){
        const keys = Object.keys(UNITS).filter(k=>FIELD.pool.def[k]>0);
        if(keys.length) dropField('def', keys[Math.floor(Math.random()*keys.length)]);
      }
    }
    const atk = FIELD.live.filter(u=>u.side==='atk');
    const def = FIELD.live.filter(u=>u.side==='def');
    const foes = {atk:def, def:atk};
    for(const u of FIELD.live){
      u.ready -= dt;
      const enemy = foes[u.side];
      let best=null, bestD=1e9;
      for(const e of enemy){
        const dx=e.x-u.x, dy=e.y-u.y, dd=Math.hypot(dx,dy);
        if(dd<bestD){bestD=dd;best=e;}
      }
      const dir = u.side==='atk'?1:-1;
      if(!best){
        u.x += dir * u.speed * dt * 0.06;
      } else if(bestD > u.range){
        u.x += Math.sign(best.x-u.x) * u.speed * dt * 0.06;
        u.y += Math.sign(best.y-u.y) * u.speed * dt * 0.03;
      } else if(u.ready<=0){
        u.ready = u.cd;
        if(u.ranged){
          FIELD.bolts.push({x:u.x,y:u.y,tx:best.x,ty:best.y,side:u.side,dmg:u.dmg,life:400});
        } else {
          best.hp -= u.dmg;
        }
      }
    }
    for(const b of FIELD.bolts){
      b.life -= dt;
      const dx=b.tx-b.x, dy=b.ty-b.y, L=Math.hypot(dx,dy)||1;
      b.x += dx/L * dt * 0.42;
      b.y += dy/L * dt * 0.42;
      if(L<12){
        const hit = FIELD.live.find(u=>u.side!==b.side && Math.hypot(u.x-b.x,u.y-b.y)<16);
        if(hit) hit.hp -= b.dmg;
        b.life = 0;
      }
    }
    FIELD.bolts = FIELD.bolts.filter(b=>b.life>0);
    FIELD.live = FIELD.live.filter(u=>u.hp>0);
    drawField();
    const leftA = armyCount(FIELD.pool.atk)+FIELD.live.filter(u=>u.side==='atk').length;
    const leftD = armyCount(FIELD.pool.def)+FIELD.live.filter(u=>u.side==='def').length;
    if(leftD<=0 && FIELD.live.filter(u=>u.side==='def').length===0) return endField('atk');
    if(leftA<=0 && FIELD.live.filter(u=>u.side==='atk').length===0) return endField('def');
    fieldRAF = requestAnimationFrame(tickField);
  }
  function drawField(){
    const cv = document.getElementById('field-cv');
    if(!cv || !FIELD) return;
    const ctx = cv.getContext('2d');
    const w=cv.width, h=cv.height;
    ctx.fillStyle = '#243022'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#3a4a30'; ctx.fillRect(0,h*0.62,w,h*0.38);
    ctx.fillStyle = '#2c3a28';
    for(let i=0;i<8;i++) ctx.fillRect(80+i*100, h*0.55, 40, 8);
    for(const u of FIELD.live){
      ctx.fillStyle = FIELD_TINT[u.k]||'#ddd';
      ctx.fillRect(u.x-7, u.y-12, 14, 18);
      ctx.fillStyle = u.side==='atk' ? '#e2c16a' : '#7a1f1a';
      ctx.fillRect(u.x-2, u.y-20, 4, 8);
      ctx.fillStyle = '#1a140c';
      ctx.fillRect(u.x-8, u.y+8, 16*(u.hp/u.max), 3);
    }
    ctx.fillStyle = '#f3e6c4';
    for(const b of FIELD.bolts){ ctx.fillRect(b.x-2,b.y-2,4,4); }
  }

  function movePlayer(from, to){
    if(S.ended==='lost') return toast('The campaign is over.');
    if(!from || !to || from===to) return;
    if(!S.provinces[from] || !S.provinces[to]) return;
    if(!neighbors(from).includes(to)) return toast('No road to that province.');
    const src = S.provinces[from], dst = S.provinces[to];
    if(src.owner!=='player') return toast('That host is not yours.');
    const marching = {...src.army};
    if(armyCount(marching)<8) return toast('Too few spears to march.');
    if(dst.owner==='player'){
      for(const k of Object.keys(UNITS)){dst.army[k]+=src.army[k]; src.army[k]=0}
      selected = to;
      pushLog(`Host joined at ${nameOf(to)}.`);
      save(); render(); return;
    }
    if(dst.owner!=='wild' && stance(dst.owner)==='ally') return toast('Break the alliance on the Factions tab first.');
    if(dst.owner!=='wild' && !canStrike(dst.owner)) return toast('Declare war on that house first. Factions tab.');
    startFieldBattle(from, to, marching, dst.army, dst.owner);
    render();
  }
  function rememberPlayer(ctx){
    if(!S) return;
    S.style = S.style || {hint:'balanced', fights:0, lastWin:null};
    const hint = compositionHint(playerHost());
    S.style.hint = hint;
    if(ctx && ctx.fight){
      S.style.fights += 1;
      S.style.lastWin = ctx.won ? 'player' : 'rival';
    }
    for(const fid of AI_IDS){
      if(!owned(fid).length) continue;
      const rec = ensureAdapt(fid);
      rec.seen += 1;
      if(ctx && ctx.vs===fid){
        if(ctx.won) rec.losses += 1;
        else rec.losses = Math.max(0, rec.losses-1);
      }
      const want = counterFor(hint, fid);
      if(rec.doc===want) continue;
      const speed = adaptSpeed(fid);
      let chance = speed * 0.28;
      if(ctx && ctx.fight && (ctx.vs===fid || ctx.public)) chance += 0.4;
      if(ctx && ctx.public) chance += speed * 0.2;
      if(rec.losses>=2) chance += 0.3;
      if(hint==='balanced') chance *= 0.4;
      if(speed<=0.25 && rec.losses<2 && !(ctx && ctx.vs===fid)) continue;
      if(Math.random() < Math.min(0.92, chance) || (ctx && ctx.vs===fid && rec.losses>=1 && want!==rec.doc)){
        const word = SHAPE_WORD[hint] || hint;
        setHouseDoctrine(fid, want, FACTIONS[fid].name+' has watched your '+word+' and will answer with '+want+'.');
      }
    }
  }
  function aiRecruit(fid){
    const doctrine = (S.adapt && S.adapt[fid] && S.adapt[fid].doc) || S.memory[fid] || FACTIONS[fid].doctrine;
    const homes = owned(fid);
    if(!homes.length) return;
    const seat = homes.reduce((best,id)=> armyCount(S.provinces[id].army)>=armyCount(S.provinces[best].army)?id:best, homes[0]);
    const a = S.provinces[seat].army;
    const pick = {
      line: 'swordsmen', raid:'lightHorse', shot:'longbows', pike:'pikemen', balanced:'militia'
    }[doctrine] || 'militia';
    const n = 6 + Math.floor(Math.random()*8);
    a[pick] = (a[pick]||0) + n;
    if(doctrine==='pike') a.militia += 4;
    if(doctrine==='raid') a.horseBow += 2;
    if(doctrine==='shot') a.crossbows += 3;
    const native = FACTIONS[fid].doctrine;
    if(native!==doctrine){
      const extra = {line:'swordsmen', raid:'lightHorse', shot:'crossbows', pike:'pikemen', balanced:'militia'}[native] || 'militia';
      a[extra] = (a[extra]||0) + 3;
    }
  }
  function aiMarch(fid){
    const homes = owned(fid);
    if(!homes.length) return;
    const targets = [];
    for(const h of homes){
      for(const n of neighbors(h)){
        const own = S.provinces[n].owner;
        if(own===fid) continue;
        if(isVassal(fid) && (own==='player' || isVassal(own))) continue;
        if(own==='player' && (stance(fid)==='ally' || isVassal(fid))) continue;
        if(isVassal(own) && stance(fid)!=='war') continue;
        if(own!=='player' && own!=='wild' && Math.random()<0.45) continue;
        targets.push({from:h,to:n, own});
      }
    }
    if(!targets.length) return;
    const docNow = (S.adapt && S.adapt[fid] && S.adapt[fid].doc) || S.memory[fid] || FACTIONS[fid].doctrine;
    const shapeNow = (S.style && S.style.hint) || 'balanced';
    const ground = (t)=>{
      const ter = terrainOf(t.to);
      let s = 0;
      if(docNow==='shot' && (ter==='hill'||ter==='wood')) s += 3;
      if(docNow==='raid' && (ter==='open'||ter==='river')) s += 3;
      if(docNow==='pike' && ter==='open') s += 1;
      if(docNow==='line' && ter==='open') s += 1;
      if(shapeNow==='cavalry-heavy' && (ter==='wood'||ter==='hill')) s += 2;
      if(shapeNow==='shot-heavy' && ter==='open') s += 2;
      if(t.own==='player') s += stance(fid)==='war' ? 5 : 1;
      else if(t.own==='wild') s += 3;
      else s += 1;
      return s;
    };
    targets.sort((x,y)=> ground(y)-ground(x) || armyCount(S.provinces[y.from].army)-armyCount(S.provinces[x.from].army));
    const pick = targets[0];
    const src = S.provinces[pick.from], dst = S.provinces[pick.to];
    if(armyCount(src.army)<14) return;
    if(Math.random() < (dst.owner==='player'?0.55:0.4)){
      const battle = resolveBattle(src.army, dst.army, terrainOf(pick.to), (src.buildings.smith||0)>=1, (dst.buildings.smith||0)>=1, pick.from, pick.to);
      lastBattle = {year:S.year,season:S.season,from:pick.from,to:pick.to,attacker:fid,defender:dst.owner,...battle};
      src.army = emptyArmy();
      if(pick.own==='player' && stance(fid)!=='war') setStance(fid,'war');
      if(battle.winner==='atk'){
        dst.army = battle.nextAtk;
        occupyHold(dst, fid);
        pushLog(`${factionName(fid)} took ${nameOf(pick.to)}. The hold is broken back to level ${dst.level}.`);
      } else {
        dst.army = battle.nextDef;
        src.army = battle.nextAtk;
        pushLog(`${factionName(fid)} failed at ${nameOf(pick.to)}.`);
      }
      if(S.home && pick.to===S.home && S.provinces[S.home].owner!=='player'){
        pushLog(nameOf(S.home)+' has fallen.');
        S.authority = Math.max(0, S.authority-3);
      }
      if(pick.own==='player') rememberPlayer({fight:true, vs:fid, won:battle.winner==='atk'});
      checkCrown();
    }
  }
  function finishWorks(id){
    const st = S.provinces[id];
    if(!st.works) return '';
    let line = '';
    if(st.works.kind==='level'){
      st.level += 1;
      line = `${nameOf(id)} is now level ${st.level}.`;
    } else {
      st.buildings[st.works.id] = (st.buildings[st.works.id]||0) + 1;
      line = `${nameOf(id)} finished ${BUILDINGS[st.works.id].name} ${st.buildings[st.works.id]}.`;
    }
    st.works = null;
    pushLog(line);
    return line;
  }

  let eventQueue = [];
  function livingHouses(){ return AI_IDS.filter(id=>owned(id).length); }
  function neighborHouses(){
    const mine = owned('player');
    const out = new Set();
    for(const id of mine) for(const n of neighbors(id)){
      const o = S.provinces[n].owner;
      if(o && o!=='player' && o!=='wild') out.add(o);
    }
    return [...out];
  }
  function queueEvent(ev){ if(ev) eventQueue.push(ev); }
  function showEvent(){

          {label:'Do nothing. Borders burn.', apply:()=>{ S.authority=Math.max(0,S.authority-1); addFeel(fidN,-3,n+' watches you swallow the slight.'); }, log:'You let the hamlet lie.', toast:'Authority slips.'}

          choices:[
            {label:'Pay the tithe (18 food)', apply:()=>{ if(S.food>=18){S.food-=18;addFeel('abbey',12,voiceOf('abbey','accept'));S.authority+=1;} else addFeel('abbey',-4,voiceOf('abbey','refuse')); }, log:'You tithed the Abbey.', toast:'Bells, somewhere.'},

        choices:[
          {label:'Underwrite them (15 gold, hope of return)', apply:()=>{ if(S.gold>=15){S.gold-=15; if(Math.random()<0.65){S.gold+=28;S.food+=8;addFeel(fid,8,n+': '+voiceOf(fid,'gift'));} else {addFeel(fid,3,n+': the wagons came home thin.');} } }, log:'You backed a caravan of '+n+'.', toast:'The wagons roll.'},
          {label:'Seize the cargo', apply:()=>{ S.gold+=16;S.food+=10; addFeel(fid,-18,n+': '+voiceOf(fid,'war')); if(stance(fid)==='ally'){ setStance(fid,'peace'); } }, log:'You seized a caravan of '+n+'.', toast:n+' will not forget the wagons.'},
          {label:'Wave them on', apply:()=>{ addFeel(fid,2,n+' notes the open road.'); }, log:n+' passed without a deal.', toast:'Dust on the road.'}
        ]
      });
    }
    if(owned('wolf').length && stance('wolf')!=='ally'){
      deck.push({
        tag:'Wolfmoot', title:'The pack names a hunt',
        body:voiceOf('wolf','glove')+' They will run a third banner if you feed the hunt — or they may run you later.',

        ]

    }
    if(S.food>=40 && Math.random()<0.7){
      deck.push({
        tag:'Harvest', title:'A fat year, or a lie about one',
        body:'Reeves argue whether to store the surplus or feast the levy. A feast buys love. A store buys winter.',
        choices:[
          {label:'Store it. +1 authority', apply:()=>{ S.authority+=1; }, log:'You stored the surplus.', toast:'The granaries sit heavy.'},
          {label:'Feast the levy. −12 food, +6 manpower in your home', apply:()=>{ if(S.food>=12){S.food-=12;} const home=owned('player')[0]; if(home) S.provinces[home].manpower += 6; }, log:'You feasted the levy.', toast:'The yard is loud.'},

        ]
      });
    }
    const proud = live.filter(id=>HOUSE[id].pride>=7 && stance(id)!=='war');
    if(proud.length){
      const fid=pickH(proud), n=FACTIONS[fid].name;
      deck.push({
        tag:'Honor', title:n+' asks who you are',

        choices:[
          {label:'Send a courtesy gift (25 gold)', apply:()=>{ if(S.gold>=25){S.gold-=25;addFeel(fid,9,n+': '+voiceOf(fid,'gift'));} else addFeel(fid,-6,n+': '+voiceOf(fid,'refuse')); }, log:'You answered '+n+' with gold.', toast:n+' marks the courtesy.'},

        ]

    const shuffle = deck.sort(()=>Math.random()-0.5);
    queueEvent(shuffle[0]);
    if(Math.random()<0.28 && shuffle[1]) queueEvent(shuffle[1]);

  const CROWN_SEATS = 12;
  function realmGoal(){
    const mine = owned('player').length;
    const rivals = AI_IDS.filter(id=>owned(id).length && !isVassal(id)).length;
    const homeLost = !!(S.home && S.provinces[S.home] && S.provinces[S.home].owner!=='player');
    const lost = mine<=0;
    const won = !lost && (mine>=CROWN_SEATS || rivals===0);
    return {mine, rivals, homeLost, won, lost, need:CROWN_SEATS};
  }
  function endingBody(g){
    if(g.lost){
      return 'No seat remains under '+S.name+'. Year '+S.year+', '+SEASONS[S.season]+'. The isle keeps other names.';
    }
    if(g.mine>=g.need){
      return S.name+' holds '+g.mine+' of '+g.need+' seats. That is the crown measure. Vassals never counted. Year '+S.year+', '+SEASONS[S.season]+'.';
    }
    return 'No independent rival hall still stands. '+S.name+' is the last banner that can name a seat. Year '+S.year+', '+SEASONS[S.season]+'.';
  }
  function closeCampaign(kind){
    if(!S || S.ended==='lost' || S.ended==='won') return;
    if(S.ended==='ruled' && kind==='won') return;
    S.ended = kind;
    const g = realmGoal();
    S.endedAt = {year:S.year, season:S.season, seats:g.mine, rivals:g.rivals};
    pushLog(kind==='won' ? 'The isle answers '+S.name+'. Twelve seats, or no rival hall left standing.' : 'The last hold is lost.');
    queueEvent({
      tag: kind==='won' ? 'The crown' : 'Fall',
      title: kind==='won' ? S.name+' takes the isle' : 'The hall is taken',
      body: endingBody(g),
      choices: kind==='won'
        ? [
            {label:'Keep the crown — the isle is already won', apply:()=>{ S.ended='ruled'; openView('realm','overview'); }, toast:'The isle is yours to keep.'},
            {label:'Begin a new campaign', apply:()=>{ mode='gate'; S=null; lastBattle=null; focus=null; eventQueue=[]; }, toast:'The map is wiped.'}
          ]
        : [
            {label:'Begin a new campaign', apply:()=>{ mode='gate'; S=null; lastBattle=null; focus=null; eventQueue=[]; }, toast:'The map is wiped.'}
          ]
    });
  }
  function checkCrown(){
    if(!S || S.ended==='lost' || S.ended==='won') return;
    if(S.ended==='ruled') return;
    const g = realmGoal();
    if(g.lost) closeCampaign('lost');
    else if(g.won) closeCampaign('won');
  }
  function endSeason(){
    if(S.ended==='lost'){ toast('The campaign is over. Begin another from the mast.'); return; }
    if(!owned('player').length){ closeCampaign('lost'); save(); render(); return; }
    const beats = [];
    for(const id of Object.keys(S.provinces)){
      const line = finishWorks(id);
      if(line) beats.push(line);
    }
    let gold=0,food=0,timber=0,iron=0;
    for(const id of owned('player')){
      const prod = productionOf(id), st = S.provinces[id];
      gold+=prod.gold; food+=prod.food; timber+=prod.timber; iron+=prod.iron;
      S.gold += prod.gold; S.food += prod.food; S.timber += prod.timber; S.iron += prod.iron;
      st.manpower = clamp(prod.manpower, 4, 90);
    }
    S.gold += S.authority;
    beats.push('Harvest: +'+gold+' gold, +'+food+' food, +'+timber+' timber, +'+iron+' iron.');
    const before = lastBattle;
    const logMark = S.log.length;
    for(const fid of AI_IDS){
      if(owned(fid).length){ aiRecruit(fid); aiMarch(fid); }
    }
    runCaptains();
    collectVassals();
    rememberPlayer({public:true});
    aiLetters();
    const fresh = S.log.slice(0, Math.max(0, S.log.length-logMark)).map(x=>x.m).reverse();
    const wars = fresh.filter(m=>/took|struck|broke|pact|war|kneel|revolt|throws|declares/i.test(m)).slice(0,6);
    if(wars.length) beats.push(...wars);
    else beats.push('The other banners kept their roads this season.');
    S.food = Math.max(0, S.food - Math.ceil(fieldCount('player')*0.15));
    if(S.food<=0){S.authority=Math.max(0,S.authority-2);beats.push('Famine bites. Authority slips.');pushLog('Famine bites. Authority slips.')}
    S.season += 1;
    if(S.season>3){S.season=0;S.year+=1}
    const fought = lastBattle && lastBattle!==before;
    queueEvent({
      tag: 'The season turns',
      title: SEASONS[S.season]+' of Year '+S.year+' opens',
      body: beats.map(x=>'• '+x).join('<br>'),
      choices:[{label: fought ? 'Read the field report' : 'Back to the map', apply:()=>{ if(fought) openView('warfare','report'); else openView('warfare','map'); }, toast: SEASONS[S.season]+' of Year '+S.year+'.'}]
    });
    checkCrown();
    if(!S.ended) rollSeasonEvents();
    pushLog(SEASONS[S.season]+' of Year '+S.year+' opens.');
    save(); render();
  }

          </div>

        </section>

          <div class="eyebrow">The isle</div>
          <h2>${S.ended==='lost'?'The isle is lost':(S.ended==='won'||S.ended==='ruled')?'The isle is yours':`${g.mine} of ${g.need} seats toward the crown`}</h2>
          <p class="tiny muted">${S.ended==='lost'?'No seat remains. Begin a new campaign from the mast.':(S.ended==='won'||S.ended==='ruled')?`Won in Year ${S.endedAt?S.endedAt.year:S.year}. You may keep ruling, or burn the map and start again.`:`Hold ${g.need} towns of your own, or break every independent hall. Vassals kneel in spirit — they do not count toward the ${g.need}. ${g.rivals} rival hall${g.rivals===1?'':'s'} still stand${g.rivals===1?'s':''}.${g.homeLost?' Your first hall is in other hands.':''}`}</p>

  }
function viewHall(){
    const caps = S.captains || [];
    const hired = caps.filter(c=>c.hired);
    const pool = caps.filter(c=>!c.hired);
    const seats = owned('player');
    const vassalIds = Object.keys(S.vassals||{});
    const broken = AI_IDS.filter(id=>!owned(id).length && !isVassal(id));
    const card = (c, recruit)=>{
      const trait = (CAPTAIN_TRAITS[c.trait]||{label:c.trait}).label;
      const dests = seats.filter(id=>id!==c.seat && ownedRoad(c.seat,id));
      return `<div class="card">
        <div class="row"><b>${c.name}</b><span class="chip on">${UNITS[c.unit].name}</span></div>
        <div class="tiny muted">${trait} · Martial ${c.martial} · Prowess ${c.prowess} · Command ${c.command}</div>

  function costParts(u, n){

    if(c.timber) bits.push(`${c.timber*n} timber`);
    if(c.iron) bits.push(`${c.iron*n} iron`);
    if(c.manpower) bits.push(`${c.manpower*n} manpower`);
    return bits;
  }

  function bannerFill(own){
    return ({
      player:'#e2c16a',crown:'#8eb4e4',march:'#e08b84',clan:'#8fcaa6',
      amber:'#e0b24a',salt:'#9fd4d4',fen:'#86a85e',glass:'#c5d0e2',
      thorn:'#a88bc4',pale:'#efe3cc',iron:'#b4a494',abbey:'#d4c49a',
      wolf:'#a56a58',dune:'#d4bc88',wain:'#d46c5c',reed:'#6fa890',wild:'#c5c0ae'
    })[own]||'#c5c0ae';
  }
  function keepMark(x,y,own,on){
    const fill = bannerFill(own);
    const r = on?12:8;
    return `<circle cx="${x}" cy="${y}" r="${r+5}" fill="#f3e6c4" stroke="#2b2116" stroke-width="1.4"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="#2b2116" stroke-width="1.6"/>
      <rect x="${x-4}" y="${y-r-16}" width="8" height="12" fill="${fill}" stroke="#2b2116" stroke-width="1"/>
      <polygon points="${x-4},${y-r-16} ${x+12},${y-r-10} ${x-4},${y-r-4}" fill="${fill}" stroke="#2b2116" stroke-width="1"/>
      ${on?`<circle cx="${x}" cy="${y}" r="${r+12}" fill="none" stroke="#7a1f1a" stroke-width="2" stroke-dasharray="4 3"/>`:''}`;
  }
  function mapSvg(opts){
    const act = opts.act || 'select';
    const selectedId = opts.selected;
    const owners = opts.owners || {};
    const roads = EDGES.map(([a,b])=>{
      const A=PROVINCES.find(p=>p.id===a), B=PROVINCES.find(p=>p.id===b);
      return `<path d="M${A.x} ${A.y} L${B.x} ${B.y}" fill="none" stroke="#3b2f20" stroke-width="2.2" opacity=".28"/>`;
    }).join('');
    const sites = PROVINCES.map(p=>{
      const own = owners[p.id] || p.start;
      const on = p.id===selectedId;
      const label = (opts.labels && opts.labels[p.id]) || p.name;
      const host = (opts.armies && opts.armies[p.id]) || 0;
      const hot = opts.threats && opts.threats[p.id];
      return `<g class="node" data-act="${act}" data-id="${p.id}">
        ${keepMark(p.x,p.y,own,on)}
        ${hot?`<circle cx="${p.x}" cy="${p.y}" r="22" fill="none" stroke="#7a1f1a" stroke-width="2.2" opacity=".85"/>`:''}
        <text x="${p.x}" y="${p.y+36}" text-anchor="middle" font-family="Georgia,Times,serif" font-size="20" font-weight="700" fill="#24180f" stroke="#f3e6c4" stroke-width="5" paint-order="stroke">${label}</text>
        <text x="${p.x}" y="${p.y+54}" text-anchor="middle" font-family="Georgia,Times,serif" font-size="15" font-weight="700" fill="#3a2a18" stroke="#f3e6c4" stroke-width="4" paint-order="stroke">${host?host+' spears':''}</text>
      </g>`;
    }).join('');
    const fit = 'xMidYMid meet';
    return `<svg class="map" viewBox="${MAP_VIEW}" preserveAspectRatio="${fit}">
      <image href="${mapSrc()}" x="0" y="0" width="${MAP_W}" height="${MAP_H}" preserveAspectRatio="${fit}"/>
      ${roads}${sites}
    </svg>`;
  }
  function viewMap(){
    const sel = PROVINCES.find(p=>p.id===selected) || PROVINCES[0];
    const st = S.provinces[sel.id];
    const owners = {}, armies = {}, threats = {};
    for(const p of PROVINCES){
      owners[p.id] = S.provinces[p.id].owner;
      armies[p.id] = armyCount(S.provinces[p.id].army);
    }
    for(const id of owned('player')){
      for(const n of neighbors(id)){
        const stn = S.provinces[n];
        if(stn.owner!=='player' && stn.owner!=='wild' && armyCount(stn.army)>=14 && (stn.owner==='wild'||stance(stn.owner)==='war'||HOUSE[stn.owner]?.warlike>=6))
          threats[id] = true;
      }
    }
    const canMarch = S.provinces[sel.id].owner!=='player' && neighbors(sel.id).some(n=>S.provinces[n].owner==='player');
    const from = neighbors(sel.id).find(n=>S.provinces[n].owner==='player' && armyCount(S.provinces[n].army)>=8) || (st.owner==='player'?sel.id:null);
    const troops = Object.entries(st.army).filter(([,n])=>n).map(([k,n])=>`<span class="tiny">${UNITS[k].name} <b>${n}</b></span>`).join('') || '<span class="tiny muted">No garrison worth naming.</span>';
    const ownedNext = neighbors(sel.id).filter(n=>S.provinces[n].owner==='player');
    const action = st.owner==='player'
      ? `<button class="btn primary" data-act="enter" data-id="${sel.id}">Work this settlement</button>
         ${ownedNext.map(n=>`<button class="btn" data-act="map-send" data-to="${n}" ${armyCount(st.army)?'':'disabled'}>Send ${armyCount(st.army)} spears: ${nameOf(sel.id)} → ${nameOf(n)}</button>`).join('')}
         <div class="tiny muted">Level ${st.level} · ${st.manpower} manpower. Select a town, then send it down a named road.</div>`
      : `<button class="btn primary" data-act="march" data-from="${from||''}" data-to="${sel.id}" ${from&&canMarch&&(st.owner==='wild'||canStrike(st.owner))?'':'disabled'}>${
          st.owner!=='wild'&&stance(st.owner)==='ally'?'Allied — break the pact first':
          st.owner!=='wild'&&!canStrike(st.owner)?'Declare war first':
          from?'March from '+nameOf(from):'Move a host onto a bordering road'
        }</button>
         ${st.owner!=='wild'&&st.owner!=='player'?`<div class="tiny muted">Stance: ${stance(st.owner)}</div>`:''}`;
    return `
      <div class="map-screen">
        <div class="mapframe">
          <div class="map-plaque">
            <div>
              <div class="eyebrow">${st.owner==='player'?'Your land':factionName(st.owner)}</div>
              <h2>${nameOf(sel.id)}</h2>
              <div class="tiny muted">${sel.terrain} ground · garrison ${armyCount(st.army)}</div>
            </div>
            <div class="map-levy">${troops}</div>
            <div class="stack">${action}</div>
          </div>
          <div class="mapwrap">
            ${mapSvg({act:'select', selected, owners, labels:S.labels, armies, threats})}
          </div>
        </div>
      </div>`;
  }

  function viewWar(){

      </div>` : `
      <div class="settle-skin" style="background-image:url('${REPORT_ART.field}')">
      <section class="panel work-card" style="background-image:url('${REPORT_ART.field}')">
        <div class="eyebrow">War room</div>
        <h2>No battle this season</h2>
        <p class="muted">March from Warfare → Map. This report is a separate subtab so it never stacks under the map.</p>
        <div class="empty">Open Map, pick a bordering province, march the host.</div>
        <button class="btn" style="margin-top:12px" data-act="open" data-group="warfare" data-sub="map">Go to Map</button>
      </section>
      </div>`;
  }

  function viewFactions(){
    return `
      <p class="tiny muted" style="margin:0 0 10px">Houses answer according to temper. Gifts, strength, and slights change the letter they send. Allies will not march on you. War is required to take a banner seat.</p>
      <div class="grid3">${AI_IDS.map(fid=>{
        const f=FACTIONS[fid], lands=owned(fid), rel=stance(fid), house=HOUSE[fid], mood=feelOf(fid);
        const art = BANNER_ART[fid]||'';
        const warm = warmthWord(mood.score);
        return `<section class="panel house-card">
          <img class="banner" alt="${f.name}" src="${art}">
          <div>
          <div class="eyebrow">${lands.length?'Active':'Broken'} · <span class="stance ${rel}">${rel}</span> · <span class="stance ${warm==='warm'||warm==='cordial'?'ally':warm==='hostile'||warm==='cold'?'war':'peace'}">${warm}</span></div>
          <h2>${f.name}</h2>
          <p class="tiny muted">${house.line}</p>
          <div class="tiny muted">${lands.length} seats · host ${fieldCount(fid)} · doctrine ${(() => { const d=(S.adapt&&S.adapt[fid]&&S.adapt[fid].doc)||S.memory[fid]||f.doctrine; const help=DOCTRINE[d]||DOCTRINE.balanced; const shifted=S.adapt&&S.adapt[fid]&&S.adapt[fid].doc && S.adapt[fid].doc!==f.doctrine; return `<span class="doctrine-tip" tabindex="0">${d}${shifted?' · shifted':''}<span class="tip"><b>${help.title}</b>${help.mean}</span></span>`; })()}</div>
          ${S.adapt&&S.adapt[fid]&&S.adapt[fid].note?`<p class="tiny gold" style="margin:6px 0 0">${S.adapt[fid].note}</p>`:''}
          <p class="tiny" style="margin:8px 0 0">${mood.last}</p>
          <div class="row wrap" style="margin-top:8px">
            <button class="btn small" data-act="diplo" data-id="${fid}" data-st="gift" ${!lands.length?'disabled':''}>Gift 25g</button>
            <button class="btn small" data-act="diplo" data-id="${fid}" data-st="ally" ${rel==='ally'||!lands.length?'disabled':''}>Offer pact</button>
            <button class="btn small" data-act="diplo" data-id="${fid}" data-st="peace" ${rel==='peace'||!lands.length?'disabled':''}>Seek peace</button>
            <button class="btn small danger" data-act="diplo" data-id="${fid}" data-st="war" ${rel==='war'||isVassal(fid)?'disabled':''}>War</button>
            ${!lands.length && !isVassal(fid) && grantableSeats().length?`<button class="btn small" data-act="open" data-group="realm" data-sub="hall">Offer vassalage</button>`:''}
            ${isVassal(fid)?'<div class="tiny muted">Vassal of your hall.</div>':''}
          </div>
          </div>
        </section>`}).join('')}
      </div>`;
  }

  function renderNav(){
    document.getElementById('tabs').innerHTML = Object.entries(NAV).map(([id,g])=>
      `<button class="tab" data-act="open" data-group="${id}" aria-selected="${group===id?'true':'false'}">${g.label}</button>`
    ).join('');
    const g = NAV[group];
    const subs = currentSubs();
    document.getElementById('subs').innerHTML =
      `<span class="subs-label">${g.label}</span>` +
      Object.entries(subs).map(([id,label])=>
        `<button class="subtab" data-act="open" data-group="${group}" data-sub="${id}" aria-selected="${sub[group]===id?'true':'false'}">${label}</button>`
      ).join('');
    const nest = document.getElementById('settle-subs');
    const showNest = group==='warfare' && sub.warfare==='settlement';
    nest.classList.toggle('hidden', !showNest);
    if(showNest){
      const title = focus && S.provinces[focus]?.owner==='player' ? nameOf(focus) : 'Settlement';
      nest.innerHTML =
        `<span class="subs-label">${title}</span>` +
        Object.entries(SETTLE_TABS).map(([id,label])=>
          `<button class="subtab" data-act="settle" data-settle="${id}" aria-selected="${settleTab===id?'true':'false'}" ${focus?'':'disabled'}>${label}</button>`
        ).join('');
    }
  }
  function renderStage(){
    const screen = sub[group];
    let draw;
    if(group==='warfare' && screen==='settlement'){
      draw = {overview:viewSettlement, works:viewHold, levy:viewHost}[settleTab] || viewSettlement;
    } else {
      draw = {
        overview: viewRealm,
        ledger: viewLedger,
        hall: viewHall,
        map: viewMap,
        settlement: viewSettlement,
        report: viewWar,
        houses: viewFactions,
        account: viewAccount
      }[screen];
    }
    document.getElementById('stage').innerHTML = draw ? draw() : '<section class="panel"><h2>Missing screen</h2></section>';
  }
  function renderSetup(){
    if(!setupWorld){ setupWorld = generateWorld(hashSeed('isle-'+Date.now())); applyWorld(setupWorld); }
    document.getElementById('app').classList.add('hidden');
    document.getElementById('gate').classList.add('hidden');
    const box = document.getElementById('setup');
    box.classList.remove('hidden');
    const place = PROVINCES.find(p=>p.id===pickHome) || PROVINCES[0];
    const isle = currentIsle();
    const owners = {};
    for(const p of PROVINCES) owners[p.id] = p.id===pickHome ? 'player' : p.start;
    box.innerHTML = `
      <header>
        <div class="eyebrow">Operation Browser Warfare</div>
        <h1 style="margin-top:6px">Name the hold. Plant the banner.</h1>
        <p class="sub">${isle.name}. ${isle.line} Twenty towns. You take one seat.</p>
        <div class="row wrap" style="margin-top:10px">
          ${ISLES.map(i=>`<button class="btn small ${i.id===isle.id?'primary':''}" data-act="pick-isle" data-id="${i.id}">${i.name}</button>`).join('')}
        </div>
      </header>
      <div class="mapwrap">${mapSvg({act:'pick-home', selected:pickHome, owners, labels:{[pickHome]:pickName||place.name}})}</div>
      <footer>
        <div class="pickbar">
          <label>Hold name
            <input id="hold-name" value="${esc(pickName)}" maxlength="40">
          </label>
          <div>
            <div class="tiny muted">Starting ground</div>
            <b>${place.name}</b> · ${place.terrain}
          </div>
          <button class="btn" data-act="reshuffle">Draw another layout</button>
          <button class="btn" data-act="gate">Back to the hall</button>
          <button class="btn primary" data-act="begin">Begin campaign</button>
        </div>
      </footer>`;
  }
  function enterSetup(isleId){
    const input = document.getElementById('hold-name');
    if(input) pickName = input.value;
    setupWorld = generateWorld(hashSeed('isle-'+Date.now()+Math.random()), isleId);
    applyWorld(setupWorld);
    pickHome = PROVINCES[0].id;
    mode = 'setup';
    render();
  }
  function localCampaign(){
    const raw = load();
    return raw && raw.home ? raw : null;
  }
  function openLocalCampaign(src){
    if(!src || !src.home){ toast('No campaign on this browser.'); return; }
    S = src;
    lastBattle = null;
    focus = src.home;
    selected = src.home;
    mode = 'play';
    if(S.world) applyWorld(S.world);
    openView('warfare','map');
    render();
    toast(S.name+' stands at '+nameOf(S.home)+'.');
  }
  async function openCloudCampaign(){
    if(!account.token){ toast('Sign in first.'); return; }
    try{
      const remote = await cloudPull();
      if(!remote){ toast('No cloud campaign on this account yet.'); return; }
      openLocalCampaign(remote);
      toast('Loaded from Google.');
    }catch(err){ toast(err.message||'Could not load the cloud campaign.'); }
  }
  function renderGate(){
    document.getElementById('app').classList.add('hidden');
    document.getElementById('setup').classList.add('hidden');
    const box = document.getElementById('gate');
    box.classList.remove('hidden');
    const who = account.profile;
    const local = localCampaign();
    const inPlay = S && S.home && mode!=='setup';
    box.innerHTML = `
      <div class="veil"></div>
      <div class="sheet">
        <div class="eyebrow">Operation Browser Warfare</div>
        <h1>The hall is open.</h1>
        <p class="muted">Give a name. Then choose a campaign. Each new campaign draws a different isle — vale, fjords, dunes, or the drowned midland.</p>
        <div class="card" style="margin-top:12px">${who
          ? `<b>${esc(who.name||'Google account')}</b><div class="tiny muted">${esc(who.email||'')}</div><div class="tiny muted" style="margin-top:6px">${account.hasCloud?'A cloud campaign is waiting on this account.':'No cloud campaign stored yet.'}</div>`
          : `<b>The door asks for a name.</b><div class="tiny muted">Sign in with Google to keep the campaign in the cloud, or sit this browser only.</div>`}
        </div>
        <div class="actions">
          ${who
            ? `<button class="btn primary" data-act="gate-new">Start a new campaign</button>
               <button class="btn" data-act="gate-cloud" ${account.hasCloud?'':'disabled'}>Load from Google</button>
               ${local?`<button class="btn" data-act="gate-local">Continue this browser · ${esc(local.name||'Unnamed')}</button>`:''}
               <button class="btn ghost" data-act="google-out">Sign out</button>`
            : `<button class="btn primary" data-act="google-in">Sign in with Google</button>
               <button class="btn" data-act="gate-guest">Play only on this browser</button>
               ${local?`<button class="btn" data-act="gate-local">Continue this browser · ${esc(local.name||'Unnamed')}</button>`:''}`}
        </div>
      </div>`;
  }
  function beginCampaign(){
    const input = document.getElementById('hold-name');
    if(input) pickName = input.value;
    S = newGame(pickHome, pickName);
    selected = pickHome;
    focus = pickHome;
    lastBattle = null;
    mode = 'play';
    openView('warfare','map');
    save();
    render();
    toast(S.name+' stands at '+nameOf(pickHome)+'.');
  }
  const TUTOR_SETUP = [
    {t:'Name the hold', b:'Type the name of your starting town in the box at the bottom. That name is your realm and that place.'},
    {t:'Pick the ground', b:'Click a banner on the painted map. Forest, river, hills and fields fight differently later. The dashed ring is your choice.'},
    {t:'The isle', b:'There are four painted isles. Vale, fjords, dunes, drowned midland. The buttons above the map pick one. Draw another layout keeps the painting and moves the towns.'},
    {t:'Begin', b:'Hit Begin campaign when the name and the town are right. Fifteen other houses plant banners. A taken town falls back to a level 1–2 hold.'}
  ];
  const TUTOR_PLAY = [
    {t:'The board', b:'Realm is the season and the books. Warfare is the map and the fighting. Factions is who still stands. Those three tabs never change.'},
    {t:'The map', b:'Warfare → Map. Click a town you own to work it. Click a neighbor and March to take it. Roads only run to bordering holds.'},
    {t:'A settlement', b:'Settlement opens a second row: Overview, Works, Levy. Works raise the town. Levy raises the garrison. Map takes you back to the isle.'},
    {t:'The levy', b:'Each troop lists what one man costs, then what Raise 5 and Raise 10 cost in gold, food, timber, iron and local manpower.'},
    {t:'The season', b:'End season in the bottom bar when the work is queued and the host is placed. Harvest comes in. Then the other houses move.'},
    {t:'Diplomacy', b:'Factions is where you Ally, make Peace, or declare War. You cannot march on a house until you are at war. Allies will not march on you.'},
    {t:'The crown', b:'Twelve seats of your own win the isle. Vassals do not count. Break every independent hall and that also ends it. Lose your last town and the campaign is over. Other houses watch how you fight and change their levy to answer it.'}
  ];
  function tutorList(){ return mode==='setup' ? TUTOR_SETUP : TUTOR_PLAY; }
  function closeTutor(saveSkip){
    const box = document.getElementById('tutor-never');
    if(saveSkip || (box && box.checked)){
      storeSet(TUTOR_KEY,'1');
      tutorOn = false;
    }
    tutorOn = false;
    renderTutor();
  }
  function openTutor(){
    tutorOn = true;
    tutorStep = 0;
    renderTutor();
  }
  function renderTutor(){
    const el = document.getElementById('tutor');
    if(!el) return;
    if(!tutorOn){ el.classList.add('hidden'); return; }
    const list = tutorList();
    tutorStep = Math.max(0, Math.min(tutorStep, list.length-1));
    const step = list[tutorStep];
    el.classList.remove('hidden');
    el.innerHTML = `
      <div class="eyebrow">Tutorial ${tutorStep+1} / ${list.length}</div>
      <h3>${step.t}</h3>
      <p>${step.b}</p>
      <div class="tutor-nav">
        <button class="btn small" data-act="tutor-prev" ${tutorStep===0?'disabled':''}>Back</button>
        <button class="btn small primary" data-act="tutor-next">${tutorStep===list.length-1?'Done':'Next'}</button>
        <button class="btn small" data-act="tutor-close">Close tutorial</button>
      </div>
      <label class="never"><input id="tutor-never" type="checkbox"> Never open this tutorial again</label>`;
  }
  function render(){
    const gateEl = document.getElementById('gate');
    if(mode==='gate'){
      if(gateEl) renderGate();
      const tutor = document.getElementById('tutor');
      if(tutor) tutor.classList.add('hidden');
      return;
    }
    if(gateEl) gateEl.classList.add('hidden');
    if(mode==='setup'){ renderSetup(); renderTutor(); return; }
    if(S.world) applyWorld(S.world);
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    resbar();
    renderNav();
    renderStage();
    renderTutor();
    showEvent();
  }

  document.body.addEventListener('click', e=>{
    const btn = e.target.closest('[data-act],.tab,.subtab,.node');
    if(!btn) return;
    const act = btn.dataset.act;
    if(act==='open'){
      openView(btn.dataset.group, btn.dataset.sub);
      render(); return;
    }
    if(act==='settle'){
      if(!focus){toast('Pick a settlement on the Map first.');return}
      openView('warfare','settlement', btn.dataset.settle);
      render(); return;
    }
    if(act==='pick-home'){
      const id = btn.dataset.id;
      if(!id) return;
      const input = document.getElementById('hold-name');
      if(input) pickName = input.value;
      pickHome = id;
      renderSetup(); return;
    }
    if(act==='reshuffle'){
      const keep = setupWorld && setupWorld.isle;
      enterSetup(keep); return;
    }
    if(act==='pick-isle'){ enterSetup(btn.dataset.id); return; }
    if(act==='gate'){ mode='gate'; render(); return; }
    if(act==='gate-new' || act==='gate-guest'){
      if(S && S.home && !confirm('Start a new campaign? The one on this browser stays until you begin and save over it.')) return;
      enterSetup(); return;
    }
    if(act==='gate-cloud'){ openCloudCampaign(); return; }
    if(act==='gate-local'){ openLocalCampaign(localCampaign()); return; }
    if(act==='begin'){ tutorStep = 0; beginCampaign(); return; }
    if(act==='tutor'){ openTutor(); return; }
    if(act==='tutor-prev'){ tutorStep = Math.max(0, tutorStep-1); renderTutor(); return; }
    if(act==='tutor-next'){
      const list = tutorList();
      if(tutorStep >= list.length-1){ closeTutor(false); return; }
      tutorStep += 1; renderTutor(); return;
    }
    if(act==='tutor-close'){ closeTutor(false); return; }
    if(act==='field-drop'){ dropField('atk', btn.dataset.id); paintField(); return; }
    if(act==='field-wave'){ releaseHost('atk'); paintField(); return; }
    if(act==='field-flee'){ endField('def', true); return; }
    if(act==='diplo'){ diploAct(btn.dataset.id, btn.dataset.st); return; }
    if(act==='vassal-offer'){ offerVassal(btn.dataset.id, btn.dataset.seat); return; }
    if(act==='vassal-revoke'){ revokeVassal(btn.dataset.id); return; }
    if(act==='cap-hire'){ hireCaptain(btn.dataset.id); return; }
    if(act==='cap-dismiss'){ dismissCaptain(btn.dataset.id); return; }
    if(act==='cap-seat'){ setCaptain(btn.dataset.id, 'seat', btn.dataset.seat); return; }
    if(act==='cap-march'){ captainMarch(btn.dataset.id, btn.dataset.to); return; }
    if(act==='event-pick'){ pickEvent(Number(btn.dataset.n)); return; }
    if(act==='select' || btn.classList.contains('node')){
      if(mode==='setup') return;
      const id = btn.dataset.id;
      if(!id || !S || !S.provinces[id]) return;
      selected = id;
      if(S.provinces[id].owner==='player') focus = id;
      openView('warfare','map'); render(); return;
    }
    if(act==='do-works'){
      enterSettlement(btn.dataset.id); openView('warfare','settlement','works'); render(); return;
    }
    if(act==='do-levy'){
      enterSettlement(btn.dataset.id); openView('warfare','settlement','levy'); render(); return;
    }
    if(act==='enter'){
      if(!btn.dataset.id || !S.provinces[btn.dataset.id]) return;
      enterSettlement(btn.dataset.id); render(); return;
    }
    if(act==='recruit') recruit(btn.dataset.id, Number(btn.dataset.n));
    if(act==='send'){
      sendMen(btn.dataset.id, Number(btn.dataset.n), btn.dataset.to);
    }
    if(act==='send-host'){
      if(selected && S.provinces[selected]?.owner==='player') focus = selected;
      sendHost(btn.dataset.to);
    }
    if(act==='build') startWorks(btn.dataset.id);
    if(act==='level') startLevel();
    if(act==='march') movePlayer(btn.dataset.from, btn.dataset.to);
    if(act==='map-send'){
      if(selected) focus = selected;
      sendHost(btn.dataset.to);
    }
    if(act==='end') endSeason();
    if(act==='save'){save();toast(account.token?'Saved here and queued to Google.':'Campaign saved in this browser.')}
    if(act==='google-in') googleSignIn();
    if(act==='google-out') googleSignOut();
    if(act==='save-client') saveClientId();
    if(act==='cloud-push'){
      if(!account.token){toast('Sign in first.');return}
      cloudPush().then(()=>{render();toast('Cloud campaign updated.')}).catch(err=>toast(err.message));
    }
    if(act==='cloud-pull'){
      if(!account.token){toast('Sign in first.');return}
      cloudPull().then(remote=>{
        if(!remote){toast('No cloud campaign yet.');return}
        if(!confirm('Replace this device’s campaign with the Google copy?')) return;
        S = remote; lastBattle=null; focus=null; selected=S.home||'millford'; mode='play'; save(); render();
        toast('Loaded from Google.');
      }).catch(err=>toast(err.message));
    }
    if(act==='new'){
      if(confirm('Leave this campaign and return to the hall?')){ mode='gate'; render(); }
    }
    if(act==='rename'){
      const n = prompt('Realm name', S.name);
      if(n && n.trim()){S.name=n.trim().slice(0,40);save();render()}
    }
  });

  const existing = load();
  if(existing && existing.home){ S = existing; selected = existing.home; }
  mode = 'gate';
  render();
})();
</script>
</body>
</html>
